<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trishakti Defence — Cadet Portal</title>
<style>
/* ============================= THEME ============================= */
:root{
  --steel-dark:#0F1013; --steel-base:#16181D; --steel-card:#1D2027; --steel-border:#2E333E;
  --bronze:#C59B27; --bronze-dark:#8C6C1B; --bronze-light:#E5C058; --gold:#E5A93C;
  --maroon:#7A0000; --maroon-dark:#4A0000; --crimson:#7A0000;
  --purple:#6A1B9A; --blue:#1565C0; --green:#4CAF50; --red:#FF5252;
  --txt:#F0F2F5; --sub:#A0A5B1;
  --radius:12px; --radius-sm:8px;
  --shadow:0 12px 32px rgba(0,0,0,.45);
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:var(--steel-dark); color:var(--txt); font-family:var(--font); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--bronze-light); text-decoration:none}
a:hover{color:var(--gold)}
h1,h2,h3,h4{margin:0;line-height:1.2}
p{margin:0}
b{font-weight:700}
::selection{background:rgba(197,155,39,.35)}
.muted{color:var(--sub)}
.tiny{font-size:11.5px}
.row{display:flex;align-items:center}
.between{justify-content:space-between}
.gap8{gap:8px}
.gap12{gap:12px}
.grow{flex:1;min-width:0}
.center{display:grid;place-items:center}

/* ============================= LAYOUT ============================= */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.sidebar{
  position:sticky;top:0;height:100vh;background:var(--steel-base);border-right:1px solid var(--steel-border);
  display:flex;flex-direction:column;padding:18px 14px;gap:4px;z-index:30;
}
.side-brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand-title{font-weight:900;letter-spacing:.14em;font-size:13px}
.brand-sub{font-size:9.5px;letter-spacing:.22em;color:var(--bronze-light);font-weight:700}
.side-nav{display:flex;flex-direction:column;gap:3px}
.side-link{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;color:var(--sub);
  font-weight:600;font-size:13px;border:1px solid transparent;transition:.14s;position:relative;
}
.side-link:hover{background:var(--steel-card);color:var(--txt)}
.side-link.active{background:rgba(197,155,39,.12);color:var(--bronze-light);border-color:rgba(197,155,39,.28)}
.nav-badge{margin-left:auto;background:var(--maroon);color:#fff;font-size:10px;font-weight:800;padding:1px 6px;border-radius:99px}
.side-foot{margin-top:auto;border-top:1px solid var(--steel-border);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.user-mini{display:flex;align-items:center;gap:10px;padding:0 6px}
.avatar{
  width:34px;height:34px;border-radius:50%;background:var(--maroon-dark);color:var(--bronze-light);
  display:grid;place-items:center;font-weight:800;font-size:12px;flex:none;border:1px solid rgba(229,192,88,.25);
}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:25;display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:12px 26px;background:rgba(22,24,29,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--steel-border);
}
.tb-title{font-weight:800;font-size:15px;letter-spacing:.02em}
.tb-sub{font-size:11.5px;color:var(--sub)}
.tb-right{display:flex;align-items:center;gap:10px;position:relative}
.sync-chip{font-size:11px;color:var(--sub);border:1px solid var(--steel-border);border-radius:99px;padding:4px 10px}
.sync-chip.warn{color:var(--gold);border-color:rgba(229,169,60,.45);background:rgba(229,169,60,.08)}
.icon-btn{
  position:relative;background:transparent;border:1px solid var(--steel-border);color:var(--sub);
  width:34px;height:34px;border-radius:9px;display:grid;place-items:center;cursor:pointer;transition:.14s;
}
.icon-btn:hover{color:var(--txt);border-color:var(--bronze);background:var(--steel-card)}
.icon-btn .dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--steel-base)}
.user-chip{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;padding-left:6px}
.content{padding:24px 26px 70px;width:100%;max-width:1440px;margin:0 auto}

/* ============================= PRIMITIVES ============================= */
.card{background:var(--steel-card);border:1px solid var(--steel-border);border-radius:var(--radius);padding:16px}
.card-hover{transition:.16s}
.card-hover:hover{border-color:rgba(197,155,39,.45);transform:translateY(-1px);box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g31{grid-template-columns:2fr 1fr}
.g13{grid-template-columns:1fr 2fr}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-head h1{font-size:23px;font-weight:900;letter-spacing:-.01em}
.page-head p{color:var(--sub);font-size:12.5px;margin-top:3px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 14px;border-radius:9px;
  border:1px solid var(--steel-border);background:var(--steel-base);color:var(--txt);font:inherit;font-weight:700;
  font-size:12.5px;cursor:pointer;transition:.14s;white-space:nowrap;
}
.btn:hover{border-color:var(--bronze);color:var(--txt)}
.btn:focus-visible{outline:2px solid var(--bronze-light);outline-offset:2px}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn-primary{background:linear-gradient(180deg,var(--bronze-light),var(--bronze));border-color:transparent;color:#1A1405}
.btn-primary:hover{filter:brightness(1.07);color:#1A1405}
.btn-danger{background:var(--crimson);border-color:#9c0000;color:#fff}
.btn-danger:hover{border-color:#c62828;filter:brightness(1.05)}
.btn-ghost{background:transparent}
.btn-block{width:100%}
.btn-sm{padding:6px 10px;font-size:11.5px;border-radius:8px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:800;letter-spacing:.06em;
  text-transform:uppercase;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.06);color:var(--sub)}
.badge.live{background:rgba(76,175,80,.18);color:var(--green)}
.badge.ok{background:rgba(76,175,80,.18);color:var(--green)}
.badge.bad{background:rgba(255,82,82,.16);color:var(--red)}
.badge.warn{background:rgba(229,169,60,.16);color:var(--gold)}
.badge.purple{background:rgba(106,27,154,.25);color:#CE93D8}
.badge.blue{background:rgba(21,101,192,.24);color:#90CAF9}
.badge.subtle{background:rgba(255,255,255,.05)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;border:1px solid var(--steel-border);
  background:transparent;color:var(--sub);font-size:11.5px;font-weight:700;cursor:pointer;transition:.14s}
.chip:hover{color:var(--txt);border-color:var(--bronze)}
.chip.active{background:rgba(197,155,39,.16);border-color:rgba(197,155,39,.5);color:var(--gold)}
.input{
  background:#121418;border:1px solid var(--steel-border);border-radius:9px;padding:10px 12px;color:var(--txt);
  font:inherit;font-size:13px;outline:none;transition:.14s;width:100%;
}
.input:focus{border-color:var(--bronze);box-shadow:0 0 0 3px rgba(197,155,39,.15)}
select.input{cursor:pointer;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);
  background-position:calc(100% - 18px) 18px,calc(100% - 13px) 18px;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--sub);font-weight:800}
.err{color:var(--red);font-size:12px;min-height:16px}
.progress{height:7px;background:var(--steel-dark);border-radius:99px;overflow:hidden;margin-top:10px}
.progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--bronze-dark),var(--bronze-light));border-radius:99px}
.empty{padding:36px 20px;text-align:center;color:var(--sub)}
.empty-ico{width:52px;height:52px;border-radius:14px;background:var(--steel-base);border:1px solid var(--steel-border);
  display:grid;place-items:center;margin:0 auto 12px;color:var(--bronze-light)}
.empty-title{font-weight:800;color:var(--txt);margin-bottom:4px}
.empty-text{font-size:12.5px;max-width:420px;margin:0 auto}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{text-align:left;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--sub);
  padding:10px 12px;border-bottom:1px solid var(--steel-border);font-weight:800;white-space:nowrap}
.table td{padding:12px;border-bottom:1px solid rgba(46,51,62,.55);vertical-align:middle}
.table tbody tr{transition:.12s}
.table tbody tr:hover{background:rgba(255,255,255,.022)}
.table tbody tr.clickable{cursor:pointer}
.table tr.me{background:rgba(197,155,39,.07)}
.table tr.me:hover{background:rgba(197,155,39,.11)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar .input{max-width:280px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--steel-border);margin-bottom:18px;overflow-x:auto}
.tab{background:transparent;border:none;border-bottom:2px solid transparent;color:var(--sub);font:inherit;
  font-weight:800;font-size:12.5px;padding:10px 14px;cursor:pointer;transition:.14s;white-space:nowrap}
.tab:hover{color:var(--txt)}
.tab.active{color:var(--bronze-light);border-bottom-color:var(--bronze)}
.tab .count{font-size:10px;opacity:.7;margin-left:4px}

/* ============================= AUTH ============================= */
.auth{min-height:100vh;display:grid;grid-template-columns:1.08fr .92fr}
.auth-left{
  padding:56px;display:flex;flex-direction:column;justify-content:center;gap:22px;position:relative;overflow:hidden;
  background:
    radial-gradient(900px 500px at 12% 18%, rgba(122,0,0,.5), transparent 62%),
    radial-gradient(700px 420px at 90% 82%, rgba(197,155,39,.16), transparent 60%),
    var(--steel-base);
  border-right:1px solid var(--steel-border);
}
.auth-left::after{content:"";position:absolute;inset:0;background-image:
  linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
  background-size:44px 44px;pointer-events:none;mask-image:radial-gradient(circle at 30% 40%,#000,transparent 78%)}
.auth-brand{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.auth-left h1{font-size:38px;font-weight:900;letter-spacing:-.02em;line-height:1.14;position:relative;z-index:1}
.grad{background:linear-gradient(90deg,var(--bronze-light),#fff2c8);-webkit-background-clip:text;background-clip:text;color:transparent}
.auth-left p.lead{color:var(--sub);max-width:460px;font-size:14px;position:relative;z-index:1}
.feature-row{display:flex;gap:12px;flex-wrap:wrap;position:relative;z-index:1;margin-top:6px}
.feature{display:flex;gap:10px;align-items:center;background:rgba(29,32,39,.72);border:1px solid var(--steel-border);
  border-radius:10px;padding:10px 12px;font-size:12px;color:var(--txt)}
.feature .fi{color:var(--bronze-light)}
.auth-right{display:grid;place-items:center;padding:40px 28px;background:var(--steel-dark)}
.auth-card{width:100%;max-width:420px;padding:26px}
.auth-card h2{font-size:20px;font-weight:900;margin-bottom:4px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--steel-base);border:1px solid var(--steel-border);
  border-radius:10px;padding:4px;margin:18px 0 20px}
.seg button{background:transparent;border:none;color:var(--sub);font:inherit;font-weight:800;font-size:12.5px;
  padding:8px;border-radius:7px;cursor:pointer;transition:.14s}
.seg button.active{background:var(--steel-card);color:var(--bronze-light);box-shadow:0 1px 0 rgba(255,255,255,.04) inset}
.auth-form{display:flex;flex-direction:column;gap:12px}

/* ============================= DASHBOARD ============================= */
.cadet-card{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.cadet-id{display:flex;gap:14px;align-items:center;min-width:0}
.cadet-id .avatar{width:52px;height:52px;font-size:17px}
.cadet-name{font-size:17px;font-weight:900}
.cadet-meta{font-size:12px;color:var(--sub)}
.kpi-row{display:flex;gap:22px;flex-wrap:wrap}
.kpi{min-width:82px}
.kpi .k{display:block;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--sub);font-weight:800}
.kpi .v{display:block;font-size:20px;font-weight:900;color:var(--gold);line-height:1.2}
.announce{
  display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:linear-gradient(90deg,rgba(122,0,0,.55),rgba(74,0,0,.35));
  border:1px solid rgba(229,192,88,.24);border-radius:var(--radius);padding:14px 18px;
}
.announce-tag{font-size:9.5px;letter-spacing:.16em;font-weight:900;color:var(--bronze-light);
  background:rgba(0,0,0,.28);padding:4px 9px;border-radius:99px;white-space:nowrap}
.live-card{
  display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  background:linear-gradient(120deg,rgba(74,0,0,.85),rgba(29,32,39,.9));
  border:1px solid rgba(229,169,60,.32);border-radius:var(--radius);padding:18px 20px;
}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:7px;
  box-shadow:0 0 0 4px rgba(76,175,80,.16);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(76,175,80,.04)}}
.wing-card{cursor:pointer;display:flex;flex-direction:column;gap:12px}
.wing-top{display:flex;gap:12px;align-items:center}
.wing-icon{width:46px;height:46px;border-radius:11px;display:grid;place-items:center;flex:none;
  border:1px solid rgba(255,255,255,.08)}
.wing-name{font-weight:900;font-size:14px}
.wing-sub{font-size:11px;color:var(--sub)}
.wing-top .badge{margin-left:auto}
.stat-row{display:flex;justify-content:space-between;background:var(--steel-dark);border-radius:9px;padding:10px 14px}
.stat-row .k{display:block;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--sub);font-weight:800}
.stat-row .v{display:block;font-size:13px;font-weight:900;color:var(--bronze-light)}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:26px 0 12px}
.section-title h2{font-size:14px;font-weight:900;letter-spacing:.03em}
.list-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;
  border-bottom:1px solid rgba(46,51,62,.55)}
.list-row:last-child{border-bottom:none}
.list-row:hover .lr-title{color:var(--bronze-light)}

/* ============================= TEST CARDS ============================= */
.test-card{display:flex;flex-direction:column;gap:8px}
.test-card h3{font-size:14px;font-weight:900;line-height:1.35;min-height:38px}
.meta{font-size:11.5px;color:var(--sub)}
.meta b{color:var(--txt)}
.test-card .btn{margin-top:auto}

/* ============================= EXAM ============================= */
.exam{min-height:100vh;display:flex;flex-direction:column;background:var(--steel-dark)}
.exam-head{
  position:sticky;top:0;z-index:22;display:flex;gap:18px;align-items:center;justify-content:space-between;
  padding:10px 20px;background:var(--steel-base);border-bottom:1px solid var(--steel-border);flex-wrap:wrap;
}
.exam-title{min-width:0}
.exam-title b{font-size:13.5px}
.exam-mid{display:flex;gap:8px;align-items:center}
.exam-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.exam-timer{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:800;font-size:15px;
  background:rgba(122,0,0,.4);color:var(--bronze-light);padding:6px 12px;border-radius:9px;
  border:1px solid rgba(229,192,88,.2);letter-spacing:.06em;
}
.exam-timer.urgent{background:rgba(122,0,0,.85);color:#fff;border-color:var(--red);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.55}}
.exam-body{
  flex:1;display:grid;grid-template-columns:minmax(0,1fr) 344px;gap:16px;padding:16px 20px 40px;
  width:100%;max-width:1440px;margin:0 auto;align-items:start;
}
.section-bar{background:var(--steel-card);border:1px solid var(--steel-border);border-radius:9px;padding:9px 14px;
  font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--gold);text-align:center;margin-bottom:12px}
.qpanel{min-width:0;display:flex;flex-direction:column;gap:12px}
.qcard{padding:18px 20px}
.qnum{font-weight:900;color:var(--gold);font-size:13px}
.qtext{margin-top:10px;color:var(--txt);white-space:pre-wrap}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{
  display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--steel-border);
  border-radius:10px;background:var(--steel-card);cursor:pointer;transition:.12s;user-select:none;
}
.opt:hover{border-color:rgba(229,192,88,.5);background:#212530}
.opt:focus-visible{outline:2px solid var(--bronze-light);outline-offset:2px}
.opt.sel{background:rgba(229,192,88,.12);border-color:var(--bronze-light)}
.opt .bub{
  width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:var(--steel-dark);border:1px solid var(--steel-border);font-weight:800;font-size:12px;color:var(--sub);
}
.opt.sel .bub{background:var(--bronze-light);color:#1A1405;border-color:transparent}
.exam-foot{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;padding:12px}
.exam-foot .btn{flex:1;min-width:110px}
.shortcuts{text-align:center;padding-bottom:8px}
.palette{position:sticky;top:74px;max-height:calc(100vh - 96px);overflow:auto;display:flex;flex-direction:column;gap:12px}
.pal-head{display:flex;justify-content:space-between;align-items:center}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.legend-item{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--sub)}
.legend-item i{width:10px;height:10px;border-radius:3px;display:inline-block}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:var(--steel-dark);border:1px solid var(--steel-border);color:var(--sub);font:inherit;
  font-size:10.5px;font-weight:800;padding:4px 9px;border-radius:6px;cursor:pointer;transition:.12s}
.pill:hover{color:var(--txt);border-color:var(--bronze)}
.pill.active{background:rgba(197,155,39,.18);border-color:rgba(197,155,39,.5);color:var(--gold)}
.qgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.qcell{aspect-ratio:1;border-radius:7px;border:2px solid transparent;display:grid;place-items:center;
  font-weight:800;font-size:12px;cursor:pointer;color:#fff;transition:.12s;font-family:inherit}
.qcell:hover{filter:brightness(1.18)}
.qcell.cur{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.14)}
.palette-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;border-top:1px solid var(--steel-border);padding-top:12px}
.palette-stats div{text-align:center}
.palette-stats span{display:block;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);font-weight:800}
.palette-stats b{font-size:13px;color:var(--bronze-light)}

/* ============================= ANALYTICS ============================= */
.score-hero{display:flex;gap:24px;justify-content:space-between;flex-wrap:wrap;align-items:flex-start}
.score-big{font-size:42px;font-weight:900;color:var(--gold);line-height:1;letter-spacing:-.02em}
.score-big small{font-size:16px;color:var(--sub);font-weight:700}
.cutoff-bar{position:relative;height:12px;background:var(--steel-dark);border-radius:99px;overflow:hidden;margin-top:16px}
.cutoff-bar > i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--bronze-dark),var(--bronze-light))}
.cutoff-mark{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--red);border-radius:2px}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi-card{background:var(--steel-card);border:1px solid var(--steel-border);border-radius:var(--radius);padding:14px;text-align:center}
.kpi-card .k{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--sub);font-weight:800}

/* =====================================================================

function effectiveSections(test){
  if (test.sections && test.sections.length) return test.sections;
  return [{name:"General", duration_min:test.duration_min, cutoff:test.cutoff}];
}
const Engine = {
  computeResult(test, answers){
    const qs = test.question_list || [];
    const perCorrect = qs.length ? test.marks / qs.length : 0;
    const sections = effectiveSections(test);
    const firstSec = sections[0].name;
    const stats = new Map();
    sections.forEach(s => stats.set(s.name, {
      name:s.name, correct:0, wrong:0, total:0, score:0, cutoff:s.cutoff, passed:false
    }));
    let c = 0, w = 0, u = 0;
    for (const q of qs){
      const secName = q.section || firstSec;
      const cur = stats.get(secName) || stats.get(firstSec);
      cur.total++;
      const a = answers[q.id];
      if (a == null) u++;
      else if (a === q.correct){ c++; cur.correct++; }
      else { w++; cur.wrong++; }
    }
    const sectionResults = Array.from(stats.values()).map(s => {
      const sc = round1(s.correct * perCorrect - s.wrong * test.negative);
      return Object.assign({}, s, {score: sc, passed: sc >= s.cutoff});
    });
    const raw = c * perCorrect - w * test.negative;
    const answered = c + w;
    return {
      correct: c, wrong: w, unanswered: u, answered,
      score: round1(Math.max(0, raw)), maxScore: test.marks,
      accuracy: answered === 0 ? 0 : Math.round(c * 100 / answered),
      sectionResults
    };
  },
  timeDiag(test, answers, timePerQ){
    let total = 0, counted = 0, overtimeWrong = 0, rapidCorrect = 0;
    for (const q of test.question_list || []){
      const t = timePerQ[q.id] || 0;
      const a = answers[q.id];
      if (t > 0){ total += t; counted++; }
      if (a != null && a !== q.correct && t > 90) overtimeWrong++;
      if (a != null && a === q.correct && t >= 1 && t <= 19) rapidCorrect++;
    }
    return {
      avgPerQ: counted === 0 ? 0 : Math.floor(total / counted),
      overtimeWrong, rapidCorrect
    };
  },
  weakTopics(test, answers){
    const map = new Map();
    const firstSec = effectiveSections(test)[0].name;
    for (const q of test.question_list || []){
      const a = answers[q.id];
      if (a != null && a !== q.correct){
        const s = q.section || firstSec;
        map.set(s, (map.get(s) || 0) + 1);
      }
    }
    return Array.from(map.entries())
      .map(([name, wrong]) => ({name, wrong}))
      .sort((a,b) => b.wrong - a.wrong)
      .slice(0, 3);
  }
};

  async catalog() {
    const [wings, tests, announcements, lectures, settings, connect, notifications] = await Promise.all([
      sb.from('wings').select('*').order('sort_order', { ascending: true }),
      sb.from('tests').select('*').eq('published', true),
      sb.from('announcements').select('*').order('created_at', { ascending: false }),
      sb.from('lectures').select('*').order('created_at', { ascending: false }),
      sb.from('settings').select('*'),
      sb.from('connect_items').select('*'),
      sb.from('notifications').select('*').order('created_at', { ascending: false })
    ]);
    return {
      wings:         wings.data         || [],
      tests:         tests.data         || [],
      announcements: announcements.data || [],
      lectures:      lectures.data      || [],
      connect:       connect.data       || [],
      notifications: notifications.data || [],
      settings:      (settings.data || []).reduce((o, r) => { o[r.key] = r.value; return o; }, {})
    };
  },

  /* --------------------------------------------------------------------
     LEADERBOARD — RPC get_global_leaderboard, with client-side fallback
     -------------------------------------------------------------------- */
  async leaderboard() {
    const { data, error } = await sb.rpc('get_global_leaderboard');
    if (!error && data) return data;

    const { data: attempts, error: aerr } = await sb
      .from('attempts')
      .select('cadet_id,score,correct,accuracy');
    if (aerr) return [];

    const byCadet = {};
    for (const a of attempts || []) {
      const c = byCadet[a.cadet_id] || { cadet_id: a.cadet_id, best_score: 0, best_correct: 0, tests_taken: 0, _acc: 0 };
      c.best_score   = Math.max(c.best_score, Number(a.score)   || 0);
      c.best_correct = Math.max(c.best_correct, Number(a.correct) || 0);
      c.tests_taken += 1;
      c._acc += Number(a.accuracy) || 0;
      byCadet[a.cadet_id] = c;
    }
    const ids = Object.keys(byCadet);
    if (!ids.length) return [];
    const { data: cadets } = await sb.from('cadets').select('id,name_hi').in('id', ids);
    const nameMap = (cadets || []).reduce((o, c) => { o[c.id] = c.name_hi; return o; }, {});
    return Object.values(byCadet)
      .map(c => ({
        cadet_id:    c.cadet_id,
        name_hi:     nameMap[c.cadet_id] || 'Cadet',
        best_score:  Math.round(c.best_score),
        best_correct: c.best_correct,
        tests_taken: c.tests_taken,
        avg_accuracy: Math.round(c._acc / c.tests_taken)
      }))
      .sort((a, b) => (b.best_correct - a.best_correct) || (b.best_score - a.best_score));
  },

  /* --------------------------------------------------------------------
     ATTEMPTS — public.attempts
     -------------------------------------------------------------------- */
  async saveAttempt(payload) {
    const { error } = await sb.from('attempts').insert([payload]);
    if (error) throw new Error(error.message);
    return payload;
  },

  async fetchAttempts(cadetId) {
    const { data, error } = await sb
      .from('attempts')
      .select('*')
      .eq('cadet_id', cadetId)
      .order('submitted_at', { ascending: false });
    if (error) throw new Error(error.message);
    return data || [];
  },

  async markNotificationsRead(cadetId, iso) {
    const { error } = await sb
      .from('cadets')
      .update({ last_notification_read_at: iso })
      .eq('id', cadetId);
    if (error) throw new Error(error.message);
    return true;
  },

  /* --------------------------------------------------------------------
     MULTIPLAYER — public.mp_rooms / mp_players / mp_answers
     -------------------------------------------------------------------- */
  async createRoom(hostId, joinCode, quizData) {
    const { data, error } = await sb
      .from('mp_rooms')
      .insert([{ host_id: hostId, join_code: joinCode, status: 'waiting', quiz_data: quizData }])
      .select()
      .single();
    if (error) throw new Error(error.message);
    return data;
  },

  async joinRoom(joinCode, cadetId) {
    const { data: rooms, error: rerr } = await sb
      .from('mp_rooms')
      .select('*')
      .eq('join_code', joinCode)
      .eq('status', 'waiting')
      .limit(1);
    if (rerr) throw new Error(rerr.message);
    if (!rooms || !rooms.length) throw new Error('Room not found or already started');
    const room = rooms[0];
    const { error: perr } = await sb
      .from('mp_players')
      .insert([{ room_id: room.id, cadet_id: cadetId }]);
    if (perr) throw new Error(perr.message);
    return room;
  },

  async submitMpAnswer(roomId, cadetId, questionId, answer, correct) {
    const { error } = await sb
      .from('mp_answers')
      .insert([{ room_id: roomId, cadet_id: cadetId, question_id: questionId, answer: answer, correct: correct }]);
    if (error) throw new Error(error.message);
    return true;
  },

  subscribeRoom(roomId, handlers) {
    return sb.channel('room-' + roomId)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'mp_players', filter: 'room_id=eq.' + roomId }, handlers.players)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'mp_answers', filter: 'room_id=eq.' + roomId }, handlers.answers)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'mp_rooms',   filter: 'id=eq.' + roomId },      handlers.room)
      .subscribe();
  }
};

/* Rank helper (replaces the removed RIVALS-based implementation). */
function rankFor(test, score) {
  const me    = (S.cadet && S.cadet.id) || '';
  const rows  = (S.leaderboard || []).filter(r => r.cadet_id !== me);
  const total = Math.max(1, rows.length + 1);
  const better = rows.filter(r => (Number(r.best_score) || 0) > score).length;
  const rank = better + 1;
  return {
    total: total,
    rank: rank,
    percentile: Math.round(100 * (total - rank) / total)
  };
}

function toast(msg, type){
  const root = document.getElementById("toasts");
  if (!root) return;
  const el = document.createElement("div");
  el.className = "toast" + (type ? " " + type : "");
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(() => {
    el.classList.add("out");
    setTimeout(() => el.remove(), 240);
  }, 3400);
}
function confirmModal(title, body, okText, danger){
  return new Promise(resolve => {
    const root = document.getElementById("modal-root");
    root.innerHTML =
      '<div class="modal-backdrop"><div class="modal card" role="dialog" aria-modal="true">' +
        '<h3>' + esc(title) + '</h3>' +

        '</div>' +
      '</div></div>';
    const done = v => { root.innerHTML = ""; resolve(v); };
    root.querySelector('[data-modal="yes"]').onclick = () => done(true);
    root.querySelector('[data-modal="no"]').onclick = () => done(false);
    root.querySelector(".modal-backdrop").onclick = e => {
      if (e.target.classList.contains("modal-backdrop")) done(false);
    };
  });
}

async function runSync(){
  const queue = Store.queue();
  if (!queue.length){ updateSyncChip(); return; }
  if (S.simOffline || !navigator.onLine){ updateSyncChip(); return; }
  let sent = 0;
  for (const payload of queue){
    try {
      await Api.saveAttempt(payload);
      Store.dequeue(payload.id);
      sent++;
    } catch(e){ break; }
  }
  updateSyncChip();
  if (sent){
    if (S.cadet && S.cadet.id) {
      try { S.attempts = await Api.fetchAttempts(S.cadet.id); }
      catch (e) { S.attempts = []; }
    } else {
      S.attempts = [];
    }
    S.leaderboard = await Api.leaderboard();
    if (!S.exam){ toast(sent + " queued attempt(s) synced.", "ok"); render(); }
    else toast(sent + " queued attempt(s) synced.", "ok");
  }
}
function updateSyncChip(){
  const el = document.getElementById("sync-chip");
  if (!el) return;
  const n = Store.queue().length;
  el.textContent = n ? n + " pending sync" : "All synced";
  el.classList.toggle("warn", n > 0);
}

  const mobile = ($("#a-mobile") && $("#a-mobile").value || "").trim();
  const pass = ($("#a-pass") && $("#a-pass").value) || "";
  setAuthError("");
  const btn = $("#auth-btn");
  setAuthBusy(btn, true);
  try {
    const res = await Api.login(mobile, pass);
    if (!res || res.error || !res.id){
      setAuthError((res && res.error) || "Login failed.");
      setAuthBusy(btn, false, "Sign in");
      return;
    }
    await onAuthed(res);
  } catch(e){
    setAuthError(e.message || "Network error.");
    setAuthBusy(btn, false, "Sign in");
  }
}
function verifyCode(){
  const code = (($("#a-code") && $("#a-code").value) || "").trim().toUpperCase();
  setAuthError("");
  if (!/^TSD-[A-Z0-9]{6}$/.test(code)){ setAuthError("Invalid code. Expected format TSD-XXXXXX."); return; }
  S.ui.authStep = 2;
  render();
}
async function doActivate(){
  const code = (($("#a-code") && $("#a-code").value) || "").trim().toUpperCase() ||
               (($("#a-code") && $("#a-code").value) || "").trim().toUpperCase();
  const mobile = ($("#a-mobile2") && $("#a-mobile2").value || "").trim();
  const pass = ($("#a-pass2") && $("#a-pass2").value) || "";
  // Code is preserved from step 1 in a hidden data attribute; fall back to stored value.
  const storedCode = (S._pendingCode || code || "").toUpperCase();
  setAuthError("");
  const btn = $("#auth-btn");
  setAuthBusy(btn, true);
  try {
    const res = await Api.activate(storedCode, mobile, pass);
    if (!res || res.error || !res.id){
      setAuthError((res && res.error) || "Activation failed.");
      setAuthBusy(btn, false, "Activate & sign in");
      return;
    }
    S._pendingCode = null;
    await onAuthed(res);
  } catch(e){
    setAuthError(e.message || "Network error.");
    setAuthBusy(btn, false, "Activate & sign in");
  }
}

function emptyState(iconName, title, text, actionHtml){
  return '<div class="empty"><div class="empty-ico">' + icon(iconName, 24) + '</div>' +
    '<div class="empty-title">' + esc(title) + '</div>' +
    '<div class="empty-text">' + esc(text) + '</div>' +
    (actionHtml || '') + '</div>';
}

function screenContent(route){
  switch (route.name){
    case "dashboard":   return screenDashboard();
    case "hub":         return screenHub(route.args[0] || "army");
    case "pretest":     return screenPretest(route.args[0] || "");
    case "analytics":   return screenAnalytics();
    case "history":     return screenHistory();
    case "unfinished":  return screenUnfinished();
    case "leaderboard": return screenLeaderboard();
    case "connect":     return screenConnect();
    case "schedule":    return screenSchedule();
    case "syllabus":    return screenSyllabus();
    case "profile":     return screenProfile();
    default:            return screenDashboard();
  }
}

/* ---------- 15.4 History ---------- */
function historyFiltered(){
  const f = S.ui.history;
  let list = S.attempts.map(a => {
    const t = S.tests.find(x => x.id === a.test_id);
    return {a, t, title: t ? t.title : "Deleted test", wing: t ? t.wing_key : null};
  });
  if (f.wing !== "all") list = list.filter(x => x.wing === f.wing);
  if (f.q) list = list.filter(x => x.title.toLowerCase().includes(f.q.toLowerCase()));
  list.sort((x,y) => {
    if (f.sort === "oldest") return (x.a.submitted_at || "").localeCompare(y.a.submitted_at || "");
    if (f.sort === "highest") return y.a.score - x.a.score;
    if (f.sort === "lowest") return x.a.score - y.a.score;
    return (y.a.submitted_at || "").localeCompare(x.a.submitted_at || "");
  });
  return list;
}
function historyRows(){
  const list = historyFiltered();
  if (!list.length) return '<tr><td colspan="7" class="muted" style="padding:28px;text-align:center">No attempts match your filters.</td></tr>';
  return list.map(x => {
    const a = x.a;
    return '<tr class="clickable" data-act="open-attempt" data-id="' + a.id + '">' +
      '<td class="muted">' + fmtDate(a.submitted_at) + '</td>' +
      '<td><b>' + esc(x.title) + '</b>' + (x.wing ? ' <span class="badge subtle">' + WING_LABEL[x.wing] + '</span>' : '') + '</td>' +
      '<td><b style="color:var(--gold)">' + a.score + '</b><span class="muted"> / ' + a.max_score + '</span></td>' +
      '<td>' + (a.accuracy >= 60 ? '<span style="color:var(--green)">' + a.accuracy + '%</span>' : '<span style="color:var(--red)">' + a.accuracy + '%</span>') + '</td>' +
      '<td class="muted">' + a.correct + ' / ' + a.wrong + ' / ' + a.unanswered + '</td>' +
      '<td>' + (a.violations ? '<span class="badge bad">' + a.violations + '</span>' : '<span class="muted">0</span>') + '</td>' +
      '<td><span class="tiny" style="color:var(--bronze-light)">View →</span></td>' +
    '</tr>';
  }).join("");
}
function refreshHistory(){
  const body = document.getElementById("hist-body");
  if (body) body.innerHTML = historyRows();
  const count = document.getElementById("hist-count");
  if (count) count.textContent = historyFiltered().length + " attempts";
}

/* =====================================================================
   16. EXAM ENGINE
   ===================================================================== */
function ensureExam(testId){
  if (S.exam && S.exam.test.id === testId && !S.exam.finished) return true;
  const test = S.tests.find(t => t.id === testId);
  if (!test) return false;
  startExam(test);
  return true;
}
function startExam(test){
  const now = Date.now();
  const secs = effectiveSections(test);
  const saved = Store.getLive(test.id);
  let st;
  if (saved && saved.endsAt > now && saved.sectionTimes.reduce((a,b) => a + b, 0) > 0){
    // Mirror ExamViewModel restore logic
    const totalLeft = Math.max(0, saved.endsAt - now);
    let future = 0;
    for (let i = saved.activeSectionIndex + 1; i < saved.sectionTimes.length; i++) future += saved.sectionTimes[i];
    const curLeft = Math.max(0, totalLeft - future);
    st = Object.assign({}, saved, {
      sectionTimes: saved.sectionTimes.slice(),
      sectionStartedAt: now,
      lastShownAt: now
    });
    st.sectionTimes[st.activeSectionIndex] = curLeft;
    Store.setLive(st);
  } else {
    st = {
      testId: test.id,
      attemptId: uuid(),
      currentIndex: 0,
      answers: {},
      marks: {},
      timePerQ: {},
      language: "EN",
      fontSize: 15,
      violations: 0,
      activeSectionIndex: 0,
      sectionTimes: secs.map(s => s.duration_min * 60000),
      sectionStartedAt: now,
      startedAt: now,
      endsAt: now + secs.reduce((a,s) => a + s.duration_min * 60000, 0),
      lastShownAt: now
    };
    Store.setLive(st);
  }
  S.ui.examFilter = "ALL";
  S.exam = {
    test,
    state: st,
    remainingMs: Math.max(0, st.sectionTimes[st.activeSectionIndex] - (now - st.sectionStartedAt)),
    finished: null
  };
  if (S.examTimer) clearInterval(S.examTimer);
  S.examTimer = setInterval(tickExam, 250);
}
function sectionIndices(ex){
  const secs = effectiveSections(ex.test);
  const cur = secs[ex.state.activeSectionIndex].name;
  const first = secs[0].name;
  return ex.test.question_list
    .map((q, i) => ({q, i}))
    .filter(x => (x.q.section || first) === cur)
    .map(x => x.i);
}
function statusOf(ex, q){
  const st = ex.state;
  return st.marks[q.id] || (st.answers[q.id] ? "ANS" : "UNANS");
}
function flushCurrentTime(ex){
  const q = ex.test.question_list[ex.state.currentIndex];
  if (!q) return;
  const delta = Math.floor((Date.now() - ex.state.lastShownAt) / 1000);
  if (delta > 0){
    ex.state.timePerQ[q.id] = (ex.state.timePerQ[q.id] || 0) + delta;
    ex.state.lastShownAt = Date.now();
  }
}
function persistLive(ex){
  const s = ex.state;
  const elapsed = Date.now() - s.sectionStartedAt;
  let totalLeft = 0;
  s.sectionTimes.forEach((budget, i) => {
    if (i < s.activeSectionIndex) totalLeft += 0;
    else if (i === s.activeSectionIndex) totalLeft += Math.max(0, budget - elapsed);
    else totalLeft += budget;
  });
  Store.setLive(Object.assign({}, s, {endsAt: Date.now() + totalLeft}));
}
function tickExam(){
  const ex = S.exam;
  if (!ex || ex.finished) return;
  const st = ex.state;
  const secs = effectiveSections(ex.test);
  const idx = st.activeSectionIndex;
  const left = Math.max(0, st.sectionTimes[idx] - (Date.now() - st.sectionStartedAt));
  ex.remainingMs = left;
  const timerEl = document.getElementById("exam-timer");
  if (timerEl){
    timerEl.textContent = fmtTime(left);
    timerEl.classList.toggle("urgent", left <= 60000);
  }
  if (left <= 0){
    if (idx < secs.length - 1) advanceSection();
    else submitExam(true);
  }
}
function advanceSection(){
  const ex = S.exam;
  if (!ex) return;
  flushCurrentTime(ex);
  const st = ex.state;
  const secs = effectiveSections(ex.test);
  if (st.activeSectionIndex >= secs.length - 1) return;
  const next = st.activeSectionIndex + 1;
  const nextName = secs[next].name;
  const firstQ = ex.test.question_list.findIndex(q => (q.section || secs[0].name) === nextName);
  st.activeSectionIndex = next;
  st.sectionStartedAt = Date.now();
  if (firstQ >= 0) st.currentIndex = firstQ;
  st.lastShownAt = Date.now();
  persistLive(ex);
  render();
}
function exSelect(letter){
  const ex = S.exam;
  if (!ex || ex.finished) return;
  const q = ex.test.question_list[ex.state.currentIndex];
  if (!q) return;
  ex.state.answers[q.id] = letter;
  ex.state.marks[q.id] = "ANS";
  persistLive(ex);
  render();
}
function exClear(){
  const ex = S.exam;
  if (!ex || ex.finished) return;
  const q = ex.test.question_list[ex.state.currentIndex];
  if (!q) return;
  delete ex.state.answers[q.id];
  ex.state.marks[q.id] = "UNANS";
  persistLive(ex);
  render();
}
function exMarkNext(){
  const ex = S.exam;
  if (!ex || ex.finished) return;
  const q = ex.test.question_list[ex.state.currentIndex];
  if (!q) return;
  ex.state.marks[q.id] = ex.state.answers[q.id] ? "ANS_REV" : "REV";
  exNext();
}
function exNext(){
  const ex = S.exam;
  if (!ex || ex.finished) return;
  flushCurrentTime(ex);
  const idxs = sectionIndices(ex);
  const pos = idxs.indexOf(ex.state.currentIndex);
  if (pos >= 0 && pos < idxs.length - 1){
    ex.state.currentIndex = idxs[pos + 1];
    ex.state.lastShownAt = Date.now();
    persistLive(ex);
    render();
  }
}
function exPrev(){
  const ex = S.exam;
  if (!ex || ex.finished) return;
  flushCurrentTime(ex);
  const idxs = sectionIndices(ex);
  const pos = idxs.indexOf(ex.state.currentIndex);
  if (pos > 0){
    ex.state.currentIndex = idxs[pos - 1];
    ex.state.lastShownAt = Date.now();
    persistLive(ex);
    render();
  }
}
function exJump(i){
  const ex = S.exam;
  if (!ex || ex.finished) return;
  flushCurrentTime(ex);
  ex.state.currentIndex = i;
  ex.state.lastShownAt = Date.now();
  persistLive(ex);
  render();
}
function exToggleLang(){
  const ex = S.exam;
  if (!ex) return;
  ex.state.language = ex.state.language === "EN" ? "HI" : "EN";
  render();
}
function exFont(d){
  const ex = S.exam;
  if (!ex) return;
  ex.state.fontSize = Math.min(22, Math.max(12, ex.state.fontSize + d));
  render();
}
function examViolation(){
  const ex = S.exam;
  if (!ex || ex.finished) return;
  ex.state.violations = (ex.state.violations || 0) + 1;
  persistLive(ex);
  if (ex.state.violations === 2) toast("Warning: tab switch detected. One more will auto-submit.");
  if (ex.state.violations >= 3){
    toast("3 violations — auto-submitting the test.");
    submitExam(true);
    return;
  }
  render();
}
async function exSubmitTest(){
  const ex = S.exam;
  if (!ex) return;
  const ok = await confirmModal("Submit test?",
    "Your answers will be evaluated and the test cannot be resumed.", "Submit test", true);
  if (ok) submitExam(false);
}
async function exSubmitSection(){
  const ex = S.exam;
  if (!ex) return;
  const secs = effectiveSections(ex.test);
  const ok = await confirmModal("Submit section?",
    "You will move to the next section and cannot return to this one.", "Submit section", false);
  if (!ok) return;
  if (ex.state.activeSectionIndex < secs.length - 1) advanceSection();
  else submitExam(false);
}
function submitExam(auto){
  const ex = S.exam;
  if (!ex || ex.finished) return;
  if (S.examTimer){ clearInterval(S.examTimer); S.examTimer = null; }
  flushCurrentTime(ex);
  const st = ex.state;
  const test = ex.test;
  const result = Engine.computeResult(test, st.answers);
  ex.finished = result;

  const payload = {
    id: st.attemptId,
    test_id: test.id,
    cadet_id: S.cadet.id,
    score: result.score,
    max_score: test.marks,
    correct: result.correct,
    wrong: result.wrong,
    unanswered: result.unanswered,
    accuracy: result.accuracy,
    answers: Object.assign({}, st.answers),
    time_per_q: Object.assign({}, st.timePerQ),
    time_spent_sec: Math.round((Date.now() - st.startedAt) / 1000),
    violations: st.violations || 0,
    started_at: new Date(st.startedAt).toISOString()
  };

  S.analytics = {
    test, result,
    answers: Object.assign({}, st.answers),
    timePerQ: Object.assign({}, st.timePerQ),
    attemptId: st.attemptId,
    submittedAt: new Date().toISOString()
  };
  Store.clearLive(test.id);
  S.exam = null;
  toast(auto ? "Time up — test submitted automatically." : "Test submitted successfully!", "ok");
  navigate("analytics");

  (async () => {
    try {
      if (S.simOffline || !navigator.onLine) throw new Error("offline");
      await Api.saveAttempt(payload);
      if (S.cadet && S.cadet.id) {
      try { S.attempts = await Api.fetchAttempts(S.cadet.id); }
      catch (e) { S.attempts = []; }
    } else {
      S.attempts = [];
    }
      S.leaderboard = await Api.leaderboard();
      toast("Attempt saved to the server.", "ok");
    } catch(e){
      Store.enqueue(payload);
      updateSyncChip();
      toast("Network error — saved locally. It will sync when you are back online.");
    }
  })();
}

function renderExam(){
  const ex = S.exam;
  if (!ex) return '<div class="exam"><div class="card">Session not found. <a href="#/dashboard">Back to dashboard</a></div></div>';
  const test = ex.test;
  const st = ex.state;
  const secs = effectiveSections(test);
  const sec = secs[st.activeSectionIndex];
  const lang = st.language;
  const q = test.question_list[st.currentIndex];
  const secQs = sectionIndices(ex);
  const posInSec = Math.max(0, secQs.indexOf(st.currentIndex));
  const answeredInSec = secQs.filter(i => st.answers[test.question_list[i].id] != null).length;
  const answeredAll = Object.keys(st.answers || {}).length;
  const total = test.question_list.length;
  const filter = S.ui.examFilter;

  const paletteQs = secQs.filter(i => {
    const s = statusOf(ex, test.question_list[i]);
    if (filter === "UNANS") return s === "UNANS";
    if (filter === "REV") return s === "REV" || s === "ANS_REV";
    return true;
  });
  const colorFor = s => s === "ANS" ? "var(--green)" : s === "REV" ? "var(--purple)" : s === "ANS_REV" ? "var(--blue)" : "var(--crimson)";

  let body = "";
  if (q){
    body =
      '<div class="card qcard">' +
        '<div class="row between">' +
          '<div class="qnum">Q. ' + (st.currentIndex + 1) + ' <span class="muted tiny">/ ' + total + '</span></div>' +
          '<div class="tiny muted">Question ' + (posInSec + 1) + ' of ' + secQs.length + ' in section</div>' +
        '</div>' +
        '<p class="qtext" style="font-size:' + st.fontSize + 'px;line-height:1.65">' +
          esc(questionText(q, lang)) + '</p>' +
      '</div>' +
      '<div class="opts">' + ["A","B","C","D"].map(L => {
        const sel = st.answers[q.id] === L;
        return '<div class="opt ' + (sel ? "sel" : "") + '" role="button" tabindex="0" ' +
          'data-act="ex-select" data-letter="' + L + '">' +
          '<span class="bub">' + L + '</span>' +
          '<span>' + esc(optionText(q, L, lang)) + '</span>' +
        '</div>';
      }).join("") + '</div>' +
      '<div class="card exam-foot">' +
        '<button class="btn" data-act="ex-prev" ' + (posInSec === 0 ? "disabled" : "") + '>← Previous</button>' +
        '<button class="btn" data-act="ex-clear">Clear</button>' +
        '<button class="btn" data-act="ex-mark">Mark &amp; next</button>' +
        '<button class="btn btn-primary" data-act="ex-next" ' + (posInSec >= secQs.length - 1 ? "disabled" : "") + '>Save &amp; next →</button>' +
      '</div>' +
      '<div class="tiny muted shortcuts">Keyboard: A–D select · ← → navigate · M mark for review</div>';
  } else {
    body = '<div class="card">' + emptyState("x", "No questions in this section", "This section has no questions assigned.") + '</div>';
  }

  return '<div class="exam">' +
    '<header class="exam-head">' +
      '<div class="exam-title">' +
        '<a class="tiny muted" href="#/dashboard">← Exit test</a>' +
        '<div><b>' + esc(test.title) + '</b></div>' +
        '<div class="tiny muted">Section ' + (st.activeSectionIndex + 1) + ' of ' + secs.length + ' · ' + esc(sec.name) + '</div>' +
      '</div>' +
      '<div class="exam-mid">' +
        '<span class="badge subtle">Q ' + (st.currentIndex + 1) + ' / ' + total + '</span>' +
        '<span class="badge ' + (st.violations ? "bad" : "subtle") + '">Focus ' + (st.violations || 0) + '/3</span>' +
      '</div>' +
      '<div class="exam-tools">' +
        '<div class="exam-timer" id="exam-timer">' + fmtTime(ex.remainingMs) + '</div>' +
        '<button class="btn btn-sm" data-act="ex-lang" title="Toggle language">' + (lang === "EN" ? "EN / हिं" : "हिं / EN") + '</button>' +
        '<button class="btn btn-sm" data-act="ex-font" data-d="-1" title="Smaller text">A−</button>' +
        '<button class="btn btn-sm" data-act="ex-font" data-d="1" title="Larger text">A+</button>' +
        (secs.length > 1 && st.activeSectionIndex < secs.length - 1
          ? '<button class="btn btn-sm" data-act="ex-section">Submit section</button>'
          : '<button class="btn btn-sm btn-danger" data-act="ex-submit">Submit test</button>') +
      '</div>' +
    '</header>' +
    '<div class="exam-body">' +
      '<main class="qpanel">' +
        (secs.length > 1
          ? '<div class="section-bar">SECTION ' + (st.activeSectionIndex + 1) + ' OF ' + secs.length + ' — ' +
            esc(sec.name).toUpperCase() + '</div>' : '') +
        body +
      '</main>' +
      '<aside class="palette card">' +
        '<div class="pal-head"><b style="font-size:13px">Question palette</b>' +
          '<span class="tiny muted">' + esc(sec.name) + '</span></div>' +
        '<div class="legend">' +
          '<span class="legend-item"><i style="background:var(--green)"></i>Answered</span>' +
          '<span class="legend-item"><i style="background:var(--crimson)"></i>Unanswered</span>' +
          '<span class="legend-item"><i style="background:var(--purple)"></i>Review</span>' +
          '<span class="legend-item"><i style="background:var(--blue)"></i>Ans + Rev</span>' +
        '</div>' +
        '<div class="filters">' +
          '<button class="pill ' + (filter === "ALL" ? "active" : "") + '" data-act="ex-filter" data-f="ALL">All (' + secQs.length + ')</button>' +
          '<button class="pill ' + (filter === "UNANS" ? "active" : "") + '" data-act="ex-filter" data-f="UNANS">Unanswered</button>' +
          '<button class="pill ' + (filter === "REV" ? "active" : "") + '" data-act="ex-filter" data-f="REV">Review</button>' +
        '</div>' +
        '<div class="qgrid">' + (paletteQs.length
          ? paletteQs.map(i => {
              const qq = test.question_list[i];
              const s = statusOf(ex, qq);
              return '<button class="qcell ' + (i === st.currentIndex ? "cur" : "") + '" ' +
                'style="background:' + colorFor(s) + '" data-act="ex-jump" data-i="' + i + '" ' +
                'title="Question ' + (i + 1) + '">' + (i + 1) + '</button>';
            }).join("")
          : '<div class="tiny muted" style="grid-column:1/-1;padding:8px 0">Nothing in this filter.</div>') +
        '</div>' +
        '<div class="palette-stats">' +
          '<div><span>Answered</span><b>' + answeredInSec + '</b></div>' +
          '<div><span>In section</span><b>' + secQs.length + '</b></div>' +
          '<div><span>Overall</span><b>' + answeredAll + '/' + total + '</b></div>' +
        '</div>' +
        (secs.length > 1 && st.activeSectionIndex < secs.length - 1
          ? '<button class="btn btn-block" data-act="ex-section">Submit section →</button>'
          : '<button class="btn btn-danger btn-block" data-act="ex-submit">Submit test</button>') +
      '</aside>' +
    '</div>' +
  '</div>';
}

/* =====================================================================
   17. ANALYTICS
   ===================================================================== */
function solutionCard(q, idx, answers, timePerQ){
  const ua = answers[q.id];
  const ok = ua === q.correct;
  const status = ua == null ? "Skipped" : ok ? "Correct" : "Wrong";
  const cls = ua == null ? "" : ok ? "ok" : "bad";
  return '<div class="card sol-card">' +
    '<div class="row between">' +
      '<div class="row gap8"><span class="qno">Q.' + (idx + 1) + '</span>' +
        '<span class="badge subtle">' + esc(q.section || "General") + '</span></div>' +
      '<div class="row gap8"><span class="badge ' + cls + '">' + status + '</span>' +
        '<span class="tiny muted">' + (timePerQ[q.id] || 0) + 's</span></div>' +
    '</div>' +
    '<p class="qtext" style="font-size:13.5px">' + esc(questionText(q, "EN")) + '</p>' +
    '<div class="sol-opts">' + ["A","B","C","D"].map(L => {
      const isC = L === q.correct;
      const isU = L === ua && ua != null;
      return '<div class="sol-opt ' + (isC ? "correct" : "") + ' ' + (isU && !isC ? "wrong" : "") + '">' +
        '<span class="bub">' + L + '</span><span>' + esc(optionText(q, L, "EN")) + '</span>' +
        (isC ? '<span class="tag-ok">Correct</span>' : '') +
        (isU && !isC ? '<span class="tag-bad">Your answer</span>' : '') +
      '</div>';
    }).join("") + '</div>' +
    (explanationText(q, "EN")
      ? '<div class="expl"><b>Explanation:</b> ' + esc(explanationText(q, "EN")) + '</div>' : '') +
  '</div>';
}
function renderSolutions(){
  const a = S.analytics;
  const el = document.getElementById("sol-list");
  if (!a || !el) return;
  const f = S.ui.solFilter;
  const items = a.test.question_list
    .map((q, i) => ({q, i}))
    .filter(({q}) => {
      const ua = a.answers[q.id];
      if (f === "WRONG") return ua != null && ua !== q.correct;
      if (f === "UNATT") return ua == null;
      if (f === "CORRECT") return ua != null && ua === q.correct;
      return true;
    });
  el.innerHTML = items.length
    ? items.map(({q, i}) => solutionCard(q, i, a.answers, a.timePerQ)).join("")
    : '<div class="card">' + emptyState("check", "Nothing here", "No questions match this filter.") + '</div>';
}
function setSolFilter(f){
  S.ui.solFilter = f;
  $$(".sol-pill").forEach(b => b.classList.toggle("active", b.dataset.f === f));
  renderSolutions();
}
function screenAnalytics(){
  const a = S.analytics;
  if (!a){
    return '<div class="page-head"><div><h1>Analytics</h1><p>Performance breakdown</p></div></div>' +
      '<div class="card">' + emptyState("chart", "No analysis loaded",
        "Open an attempt from your history to see the full breakdown.",
        '<div style="margin-top:12px"><a class="btn btn-sm btn-primary" href="#/history">Go to history</a></div>') + '</div>';
  }
  const test = a.test;
  const r = a.result;
  const rank = rankFor(test, r.score);
  const td = Engine.timeDiag(test, a.answers, a.timePerQ);
  const weak = Engine.weakTopics(test, a.answers);
  const cleared = r.score >= test.cutoff;
  const scoreFrac = test.marks > 0 ? Math.min(1, Math.max(0, r.score / test.marks)) : 0;
  const cutFrac = test.marks > 0 ? Math.min(1, Math.max(0, test.cutoff / test.marks)) : 0;
  const counts = {all:test.question_list.length, wrong:r.wrong, skipped:r.unanswered, correct:r.correct};
  const maxWeak = weak.length ? Math.max(...weak.map(w => w.wrong)) : 1;

  return '<div class="page-head">' +
    '<div><h1>Analytics</h1><p>' + esc(test.title) + ' · ' + fmtDate(a.submittedAt) + '</p></div>' +
    '<div class="row gap8">' +
      '<a class="btn btn-sm" href="#/history">← History</a>' +
      '<a class="btn btn-sm btn-primary" href="#/dashboard">Dashboard</a>' +
    '</div>' +
  '</div>' +

  '<div class="grid g31">' +
    '<div class="card">' +
      '<div class="score-hero">' +
        '<div><div class="tiny muted" style="text-transform:uppercase;letter-spacing:.1em;font-weight:800">Final score</div>' +
          '<div class="score-big">' + r.score + '<small> / ' + r.maxScore + '</small></div>' +
          '<div class="tiny muted" style="margin-top:4px">' + r.correct + ' correct · ' + r.wrong +
            ' wrong · ' + r.unanswered + ' skipped</div>' +
        '</div>' +
        '<span class="badge ' + (cleared ? "ok" : "bad") + '" style="font-size:10.5px">' +
          (cleared ? "CUTOFF CLEARED" : "BELOW CUTOFF") + '</span>' +
      '</div>' +
      '<div class="cutoff-bar">' +
        '<i style="width:' + (scoreFrac * 100) + '%"></i>' +
        '<div class="cutoff-mark" style="left:calc(' + (cutFrac * 100) + '% - 1px)"></div>' +
      '</div>' +
      '<div class="row between tiny muted" style="margin-top:8px">' +
        '<span>0</span><span>Cutoff ' + test.cutoff + '</span><span>' + test.marks + '</span>' +
      '</div>' +
    '</div>' +
    '<div class="card">' +
      '<div class="tiny muted" style="text-transform:uppercase;letter-spacing:.1em;font-weight:800">Ranking</div>' +
      '<div class="score-big" style="font-size:32px;margin-top:6px">#' + rank.rank + '</div>' +
      '<div class="tiny muted">of ' + rank.total + ' cadets who attempted this test</div>' +
      '<div class="progress" style="margin-top:12px"><i style="width:' + rank.percentile + '%"></i></div>' +
      '<div class="tiny muted" style="margin-top:6px">' + rank.percentile + 'th percentile</div>' +
    '</div>' +
  '</div>' +

  '<div class="kpi-grid" style="margin-top:16px">' +
    '<div class="kpi-card"><div class="k">Accuracy</div><div class="v">' + r.accuracy + '%</div></div>' +
    '<div class="kpi-card"><div class="k">Avg time / Q</div><div class="v">' + td.avgPerQ + 's</div></div>' +
    '<div class="kpi-card"><div class="k">Overtime wrong</div><div class="v" style="color:var(--red)">' + td.overtimeWrong + '</div></div>' +
    '<div class="kpi-card"><div class="k">Rapid correct</div><div class="v" style="color:var(--green)">' + td.rapidCorrect + '</div></div>' +
  '</div>' +

  '<div class="grid g2" style="margin-top:16px">' +
    '<div class="card">' +
      '<b style="font-size:13px">Section breakdown</b>' +
      '<table class="table" style="margin-top:8px"><thead><tr>' +
        '<th>Section</th><th>Correct</th><th>Score</th><th>Cutoff</th><th>Status</th>' +
      '</tr></thead><tbody>' +
        r.sectionResults.map(s =>
          '<tr><td><b>' + esc(s.name) + '</b></td>' +
          '<td class="muted">' + s.correct + ' / ' + s.total + '</td>' +
          '<td><b style="color:var(--gold)">' + s.score + '</b></td>' +
          '<td class="muted">' + s.cutoff + '</td>' +
          '<td><span class="badge ' + (s.passed ? "ok" : "bad") + '">' + (s.passed ? "Pass" : "Below") + '</span></td></tr>'
        ).join("") +
      '</tbody></table>' +
    '</div>' +
    '<div class="card">' +
      '<b style="font-size:13px">Weak topics</b>' +
      '<div class="tiny muted" style="margin-top:2px">Sections with the most wrong answers</div>' +
      (weak.length
        ? '<div style="margin-top:10px">' + weak.map(w =>
            '<div class="bar-row"><span class="name" title="' + esc(w.name) + '">' + esc(w.name) + '</span>' +
            '<span class="bar-track"><i style="width:' + Math.round(w.wrong * 100 / maxWeak) + '%"></i></span>' +
            '<span class="val">' + w.wrong + '</span></div>'
          ).join("") + '</div>' +
          '<div class="tiny muted" style="margin-top:10px">Focus your next revision on ' +
            esc(weak[0].name) + '.</div>'
        : '<div class="empty" style="padding:20px 0"><div class="empty-title" style="color:var(--green)">No weak topics</div>' +
          '<div class="empty-text">No wrong answers were recorded for this attempt.</div></div>') +
    '</div>' +
  '</div>' +

  '<div class="section-title"><h2>Solution review</h2>' +
    '<span class="badge subtle">' + test.question_list.length + ' questions</span></div>' +
  '<div class="row gap8" style="flex-wrap:wrap;margin-bottom:12px">' +
    '<button class="pill sol-pill ' + (S.ui.solFilter === "ALL" ? "active" : "") + '" data-act="sol-filter" data-f="ALL">All (' + counts.all + ')</button>' +
    '<button class="pill sol-pill ' + (S.ui.solFilter === "WRONG" ? "active" : "") + '" data-act="sol-filter" data-f="WRONG">Wrong (' + counts.wrong + ')</button>' +
    '<button class="pill sol-pill ' + (S.ui.solFilter === "UNATT" ? "active" : "") + '" data-act="sol-filter" data-f="UNATT">Skipped (' + counts.skipped + ')</button>' +
    '<button class="pill sol-pill ' + (S.ui.solFilter === "CORRECT" ? "active" : "") + '" data-act="sol-filter" data-f="CORRECT">Correct (' + counts.correct + ')</button>' +
  '</div>' +
  '<div id="sol-list" style="display:flex;flex-direction:column;gap:12px"></div>';
}

/* =====================================================================
   18. AFTER-RENDER WIRING
   ===================================================================== */
function afterRender(route){
  updateSyncChip();

  if (route.name === "history"){
    const search = document.getElementById("hist-search");
    if (search){
      search.addEventListener("input", e => {
        S.ui.history.q = e.target.value;
        refreshHistory();
      });
    }
    const sort = document.getElementById("hist-sort");
    if (sort){
      sort.addEventListener("change", e => {
        S.ui.history.sort = e.target.value;
        refreshHistory();
      });
    }
  }

  if (route.name === "analytics"){
    renderSolutions();
  }

  if (route.name === "profile"){
    const cb = document.getElementById("sim-offline");
    if (cb){
      cb.addEventListener("change", e => {
        S.simOffline = e.target.checked;
        LS.set(KEYS.offline, S.simOffline);
        toast(S.simOffline ? "Offline simulation on — submissions will queue locally." : "Offline simulation off.");
        render();
      });
    }
  }

  if (route.name === "login"){
    ["a-mobile","a-pass","a-mobile2","a-pass2","a-code"].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.addEventListener("keydown", e => {
        if (e.key === "Enter"){
          e.preventDefault();
          if (id === "a-code") verifyCode();
          else if (id === "a-mobile2" || id === "a-pass2") doActivate();
          else doLogin();
        }
      });
    });
  }
}

/* =====================================================================
   19. GLOBAL EVENT DELEGATION
   ===================================================================== */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el){
    if (S.ui.notifOpen){
      const inPanel = e.target.closest(".notif-wrap");
      if (!inPanel){ S.ui.notifOpen = false; render(); }
    }
    return;
  }
  const act = el.dataset.act;

  switch (act){
    case "go": navigate(el.dataset.to); break;
    case "refresh": refreshAll(); break;
    case "logout": logout(); break;

    /* auth */
    case "auth-tab":
      S.ui.authTab = el.dataset.tab;
      S.ui.authStep = 1;
      S._pendingCode = null;
      render();
      break;
    case "auth-submit": doLogin(); break;
    case "auth-demo": {
      const m = document.getElementById("a-mobile");
      const p = document.getElementById("a-pass");
      if (m) m.value = "9876543210";
      if (p) p.value = "01012000";
      if (m) m.focus();
      break;
    }
    case "auth-verify": {
      const code = (($("#a-code") && $("#a-code").value) || "").trim().toUpperCase();
      if (/^TSD-[A-Z0-9]{6}$/.test(code)){
        S._pendingCode = code;
        S.ui.authStep = 2;
        setAuthError("");
        render();
      } else setAuthError("Invalid code. Expected format TSD-XXXXXX.");
      break;
    }
    case "auth-step1":
      S.ui.authStep = 1;
      S.ui.authTab = "login";
      S._pendingCode = null;
      render();
      break;
    case "auth-activate": doActivate(); break;

    /* notifications */
    case "open-notifs":
      S.ui.notifOpen = !S.ui.notifOpen;
      if (S.ui.notifOpen) markNotificationsRead();
      render();
      break;
    case "close-notifs": S.ui.notifOpen = false; render(); break;

    /* hub */
    case "hub-cat":
      S.ui.hubCat = el.dataset.cat;
      render();
      break;

    /* history */
    case "hist-wing":
      S.ui.history.wing = el.dataset.wing;
      render();
      break;
    case "open-attempt": openAttempt(el.dataset.id); break;

    /* unfinished */
    case "discard-live":
      confirmModal("Discard saved test?",
        "The in-progress attempt will be deleted and cannot be resumed.", "Discard", true
      ).then(ok => {
        if (!ok) return;
        Store.clearLive(el.dataset.id);
        toast("Saved attempt discarded.");
        render();
      });
      break;

    /* exam */
    case "ex-select": exSelect(el.dataset.letter); break;
    case "ex-clear": exClear(); break;
    case "ex-mark": exMarkNext(); break;
    case "ex-next": exNext(); break;
    case "ex-prev": exPrev(); break;
    case "ex-jump": exJump(Number(el.dataset.i)); break;
    case "ex-lang": exToggleLang(); break;
    case "ex-font": exFont(Number(el.dataset.d)); break;
    case "ex-filter":
      S.ui.examFilter = el.dataset.f;
      render();
      break;
    case "ex-section": exSubmitSection(); break;
    case "ex-submit": exSubmitTest(); break;

    /* analytics */
    case "sol-filter": setSolFilter(el.dataset.f); break;

    /* profile */
    case "sync-now": runSync(); break;
    case "clear-data":
      confirmModal("Clear local data?",
        "All locally stored attempts, unfinished tests and the sync queue will be deleted.", "Clear data", true
      ).then(ok => {
        if (!ok) return;
        Store.clearAll();
        S.attempts = [];
        toast("Local data cleared.");
        Api.leaderboard().then(lb => { S.leaderboard = lb; render(); }).catch(() => render());
      });
      break;

    default: break;
  }
});

/* keyboard shortcuts for the exam */
document.addEventListener("keydown", e => {
  const ex = S.exam;
  if (!ex || ex.finished) return;
  if (parseHash().name !== "exam") return;
  const tag = (e.target && e.target.tagName) || "";
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;

  const k = e.key.toLowerCase();
  const map = {a:"A", b:"B", c:"C", d:"D", "1":"A", "2":"B", "3":"C", "4":"D"};
  if (map[k]){ e.preventDefault(); exSelect(map[k]); return; }
  if (e.key === "ArrowRight"){ e.preventDefault(); exNext(); return; }
  if (e.key === "ArrowLeft"){ e.preventDefault(); exPrev(); return; }
  if (k === "m"){ e.preventDefault(); exMarkNext(); return; }
});

/* anti-cheat: tab switches */
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden"){
    if (S.exam && !S.exam.finished && parseHash().name === "exam") examViolation();
  }
});

/* warn before closing with a live exam */
window.addEventListener("beforeunload", e => {
  if (S.exam && !S.exam.finished){
    e.preventDefault();
    e.returnValue = "";
  }
});

/* route changes */
window.addEventListener("hashchange", () => {
  const route = parseHash();
  if (S.exam && route.name !== "exam"){
    const leave = window.confirm("Leave the test? Your progress is saved, but the timer keeps running.");
    if (!leave){
      location.hash = "#/exam/" + S.exam.test.id;
      return;
    }
    if (S.examTimer){ clearInterval(S.examTimer); S.examTimer = null; }
    persistLive(S.exam);
    S.exam = null;
  }
  render();
});

/* open an attempt from history / dashboard */
function openAttempt(id){
  const a = S.attempts.find(x => x.id === id) || Store.attempts().find(x => x.id === id);
  if (!a) return toast("Attempt not found.");
  const test = S.tests.find(t => t.id === a.test_id);
  if (!test) return toast("This test is no longer available.");
  const answers = a.answers || {};
  const result = Engine.computeResult(test, answers);
  S.analytics = {
    test, result, answers,
    timePerQ: a.time_per_q || {},
    attemptId: a.id,
    submittedAt: a.submitted_at
  };
  S.ui.solFilter = "ALL";
  navigate("analytics");
}

/* =====================================================================
   20. BOOT
   ===================================================================== */
async function boot(){
  try {
    const sid = LS.get(KEYS.session, null);
    if (sid){
      const cadet = await Api.checkStudentStatus(sid);
      if (cadet && cadet.id){
        S.cadet = cadet;
        await loadAll();
      } else {
        LS.del(KEYS.session);
      }
    }
  } catch(e){
    console.warn("Boot failed", e);
  }
  S.booting = false;
  render();
  runSync();
  window.addEventListener("online", () => runSync());
}

function setupRealtimeSync() {
  if (typeof sb === 'undefined' || !sb) return;
  if (window._cmsSyncChannel) { try { sb.removeChannel(window._cmsSyncChannel); } catch(e){} }
  window._cmsSyncChannel = sb.channel('cms-sync');
  var tables = ['wings','tests','announcements','lectures','connect_items','notifications','settings'];
  tables.forEach(function(t){
    window._cmsSyncChannel.on('postgres_changes', { event: '*', schema: 'public', table: t }, async function(){
      if (!S.cadet) return;
      try {
        var cat = await Api.catalog();
        S.wings = (cat.wings && cat.wings.length > 0) ? cat.wings : S.wings;
        S.tests = cat.tests; S.announcements = cat.announcements;
        S.lectures = cat.lectures; S.connect = cat.connect; S.notifications = cat.notifications;
        S.settings = cat.settings;
        if (parseHash().name !== 'exam') render();
      } catch (e) { console.warn('Sync refetch failed', e); }
    });
  });
  window._cmsSyncChannel.subscribe();
}
